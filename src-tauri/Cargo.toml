[package]
name = "streamee"
version = "0.1.0"
description = "Interface légère pour streamers : pad de sons envoyés directement dans le micro"
authors = ["mathgen44"]
license = "MIT"
repository = "https://github.com/mathgen44/streamee"
edition = "2021"
rust-version = "1.82"

[lib]
name = "streamee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
memmap2 = "0.9"
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "wav", "pcm", "ogg", "vorbis", "aiff", "caf"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_Media"] }
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
